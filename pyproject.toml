[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-localization"
version = "0.2.0"
description = "A self-healing localization layer for Python applications, automatically creating missing language files and keys."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Tuomas Lähteenmäki" }
]

keywords = [
    "localization",
    "i18n",
    "internationalization",
    "translation",
    "templates",
    "self-healing",
    "automation",
    "python",
    "l10n",
    "glfm",
    "bcp47",
    "mymemory",
    "libretranslate"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://codeberg.org/lahtis/Self_Healing_Localization"
Repository = "https://codeberg.org/lahtis/Self_Healing_Localization"
Issues = "https://codeberg.org/lahtis/Self_Healing_Localization/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shl*"]

[tool.setuptools.package-data]
shl = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["shl"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
